#
# OPTIONAL fallback: stage NVIDIA Isaac Sim 5.1.0 (standalone, ~8.8 GB zip, ~20 GB unpacked)
# onto FSx. The isaaclab-gr00t image already has Isaac Sim at /opt/isaacsim (build args
# ISAAC_SIM_VERSION, ACCEPT_ISAAC_SIM_EULA), and ISAAC_PATH=auto uses that copy when present.
# Use this Job only for an image built without Isaac Sim. By running this Job you accept the NVIDIA Isaac Sim / Omniverse license
# (https://docs.isaacsim.omniverse.nvidia.com/latest/common/NVIDIA_Omniverse_License_Agreement.html).
#
# Isaac Sim 5.1 is the version RLinf's IsaacLab integration (RLinf/IsaacLab, Isaac Lab 2.3)
# targets. Isaac Sim 6.x needs Isaac Lab 3.0, which RLinf does not support yet.
#
# Apply:
#   export NAMESPACE=rlinf
#   envsubst '${NAMESPACE}' < examples/isaaclab-gr00t-ppo/manifests/stage-isaacsim.yaml | kubectl apply -f -
#   kubectl logs -f job/stage-isaacsim -n $NAMESPACE
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-isaacsim
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    example: isaaclab-gr00t-ppo
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: stage
          image: public.ecr.aws/docker/library/ubuntu:22.04
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              DEST=/fsx/isaacsim/5.1.0
              URL=https://download.isaacsim.omniverse.nvidia.com/isaac-sim-standalone-5.1.0-linux-x86_64.zip
              if [ -f "$DEST/setup_conda_env.sh" ] && [ -f "$DEST/.staged" ]; then
                echo "Isaac Sim already staged at $DEST"; cat "$DEST/VERSION" || true; exit 0
              fi
              apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
              mkdir -p "$DEST" /fsx/isaacsim/tmp
              ZIP=/fsx/isaacsim/tmp/isaac-sim-5.1.0.zip
              echo "Downloading $URL"
              curl -fL --retry 5 --retry-delay 10 -o "$ZIP" "$URL"
              ls -la "$ZIP"
              echo "Unzipping to $DEST"
              unzip -q -o "$ZIP" -d "$DEST"
              rm -f "$ZIP"
              test -f "$DEST/setup_conda_env.sh"
              date -u > "$DEST/.staged"
              echo "VERSION: $(cat $DEST/VERSION 2>/dev/null)"
              du -sh "$DEST"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: fsx
              mountPath: /fsx
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
