# ManiSkill + OpenVLA-OFT PPO
#
# Same container image as OpenVLA example, different venv and config.
# Trains OpenVLA-OFT (fine-tuned variant) on ManiSkill3 using PPO.
# FULL config (128 envs, global_batch_size=640) on ONE g7e.12xlarge (2x RTX PRO 6000
# 96 GB, gpu-sim pool): actor 0-1, env 0, rollout 1. EKS 1.37 (2026-11): 370 s/step,
# ~$0.85/step on-demand.
#
# Large-GPU alternative (8x H200, ~195 s/step, ~$3.4/step): set the nodeSelector to
# `node.kubernetes.io/instance-type: p5en.48xlarge` (gpu-training pool), NUM_GPUS=8,
# nvidia.com/gpu: 8 (cpu 90, memory 1000Gi), and drop the cluster.component_placement
# overrides (the config's own placement is actor 0-7, env 0-3, rollout 4-7).
#
# Image: embodied-maniskill_libero (same image as all PPO examples)
# Venv:  openvla-oft
# Config: maniskill_ppo_openvlaoft
#
# Prerequisites:
#   - gpu-sim pool enabled (workloads: enable_sim_pool=true; sim_instance_types includes g7e.12xlarge)
#   - model-download.yaml completed (downloads openvla-oft-sft-libero10)
#
# Usage:
#   export IMAGE=<account>.dkr.ecr.<region>.amazonaws.com/rlinf-on-eks/rlinf:latest   # full image; or :<profile>-latest
#   envsubst < examples/maniskill-openvlaoft-ppo.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-maniskill-openvlaoft
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    reference: rlinf
    example: maniskill-openvlaoft-ppo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rlinf
        example: maniskill-openvlaoft-ppo
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        role: gpu-sim
        node.kubernetes.io/instance-type: g7e.12xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: training
          image: ${IMAGE}
          command:
            - bash
            - -c
            - |
              cd /workspace/RLinf
              exec bash /workspace/eks/scripts/run_training_eks.sh
          env:
            - name: CONFIG_NAME
              value: "maniskill_ppo_openvlaoft"
            - name: VENV_NAME
              value: "openvla-oft"
            - name: MODEL_PATH
              value: "/fsx/models/openvla-oft-sft-libero10"
            - name: HYDRA_OVERRIDES
              value: "actor.model.lora_path=/fsx/models/rlinf-openvlaoft-maniskill-base-lora env.train.max_steps_per_rollout_epoch=160 cluster.component_placement.actor=0-1 cluster.component_placement.env=0 cluster.component_placement.rollout=1"
            - name: NUM_GPUS
              value: "2"
            - name: NUM_NODES
              value: "1"
            - name: CKPT_PATH
              value: "/fsx/checkpoints"
            - name: MANISKILL_ASSET_DIR
              value: "/fsx/assets/maniskill"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          resources:
            requests:
              nvidia.com/gpu: 2
              cpu: "40"
              memory: "400Gi"
            limits:
              nvidia.com/gpu: 2
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
