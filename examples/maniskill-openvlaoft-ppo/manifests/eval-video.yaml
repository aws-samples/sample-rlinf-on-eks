# Eval-only job to regenerate OFT showcase video matching OpenVLA format.
#
# Produces a 7-tile (single row) video at ~1370 frames / 5fps (raw). The raw video
# contains ~170 real motion frames interleaved with 7 duplicate frames each (due to
# num_action_chunks=8). Post-processing strips duplicates to produce smooth playback.
#
# Uses upstream evaluations/eval_embodied_agent.py (task_type=embodied_eval,
# rollout + env workers only) with the training config and pipeline_stage_num=2 to match
# the OpenVLA video layout (16 envs ÷ 4 GPUs ÷ 2 stages = 2 envs/stage → 7 tiles
# via ManiSkill RecordVideo tiling after stage merge).
#
# Prerequisites:
#   - Checkpoint on FSx (from training run)
#   - Model weights at /fsx/models/openvla-oft-sft-libero10 (from model-download.yaml)
#   - Base LoRA adapter at /fsx/models/rlinf-openvlaoft-maniskill-base-lora
#     (from model-download.yaml). It only supplies the PEFT structure; the
#     trained LoRA weights come from full_weights.pt (runner.ckpt_path). At
#     main@c70606f0 checkpoints hold only dcp_checkpoint/ + full_weights.pt.
#   - ManiSkill assets at /fsx/assets/maniskill
#
# Usage:
#   export IMAGE=<account>.dkr.ecr.<region>.amazonaws.com/rlinf-on-eks/rlinf:latest   # full image; or :<profile>-latest
#   export NAMESPACE=rlinf
#   export CKPT_PATH=/fsx/checkpoints/<run>/.../full_weights.pt
#   export LORA_PATH=/fsx/models/rlinf-openvlaoft-maniskill-base-lora
#   ./examples/scripts/generate-showcase-video.sh maniskill-openvlaoft-ppo
#
# Output:
#   Raw video at /fsx/checkpoints/openvlaoft-eval-video/video/eval/seed_*/0.mp4
#
# Post-processing (strip duplicate frames, keep every 8th):
#   ffmpeg -i raw.mp4 \
#     -vf "select='not(mod(n\,8))',setpts=N/FRAME_RATE/TB" \
#     -r 5 -c:v libx264 -pix_fmt yuv420p -crf 28 -preset slow \
#     -y assets/maniskill_openvlaoft_success.mp4
#
#   Result: ~173 frames, 5fps, 34.6s, 3584x512 (matches OpenVLA showcase video)
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-openvlaoft-eval-video
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    example: maniskill-openvlaoft-ppo
    purpose: eval-video
  annotations:
    rlinf.io/num-action-chunks: "8"
    rlinf.io/video-output-path: "openvlaoft-eval-video"
    rlinf.io/asset-filename: "maniskill_openvlaoft_success.mp4"
    rlinf.io/s3-bucket: "${S3_BUCKET}"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rlinf
        example: maniskill-openvlaoft-ppo
        purpose: eval-video
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        node.kubernetes.io/instance-type: p5en.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: eval
          image: ${IMAGE}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              set -x

              # Activate venv
              export PYTHONPATH="${PYTHONPATH:-}"
              source /opt/venv/openvla-oft/bin/activate

              # Environment
              export MUJOCO_GL=osmesa
              export PYOPENGL_PLATFORM=osmesa
              export NVIDIA_DRIVER_CAPABILITIES=all
              export LD_LIBRARY_PATH="/usr/lib64:${LD_LIBRARY_PATH:-}"
              export NCCL_DEBUG=WARN
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              export EMBODIED_PATH=/workspace/RLinf/examples/embodiment

              # Link simulator assets
              if [ -x "/usr/local/bin/link_assets" ]; then link_assets; fi

              cd /workspace/RLinf

              # Run eval with video recording.
              # Key overrides to match OpenVLA video format:
              #   rollout.pipeline_stage_num=2    → matches OpenVLA rollout config
              #   env.eval.enable_offload=True    → uses ManiskillOffloadEnv (capture_image at 512×512)
              #   env.eval.total_num_envs=16      → 16 envs across 4 GPUs × 2 stages
              #   env.eval.max_steps_per_rollout_epoch=1360  → 17x episode length to accumulate
              #     ~170 real motion frames (OFT chunks 8 actions, so only every 8th frame has motion)
              #   env.eval.video_cfg.save_video=True
              #
              # Post-processing required: strip duplicate frames (keep every 8th) to produce
              # a smooth video matching OpenVLA's frame-per-step format. See header comment.
              #
              # Entrypoint: upstream evaluations/eval_embodied_agent.py (the old
              # examples/embodiment/eval_embodied_agent.py was removed upstream in 2e1c99f7).
              # It forces runner.task_type=embodied_eval and builds ONLY rollout + env
              # workers from cfg.rollout.model / cfg.env.eval (no actor). Hydra's
              # config_path is relative to evaluations/, so --config-path must be absolute.
              # We keep the TRAINING config so model/env settings match training exactly:
              #   'rollout.model=${actor.model}'  → the training config's rollout.model is a
              #     stub (path+precision); embodied_eval requires a full spec (model_type,
              #     num_action_chunks). Hydra interpolation (single-quoted for bash; envsubst
              #     leaves it alone) makes rollout.model the exact training architecture
              #     (value head + LoRA r=32), which runner.ckpt_path is strict-loaded into.
              #   actor.model.model_path / lora_path → set on actor.model; rollout.model
              #     mirrors them via the interpolation (rollout.model.* can't be overridden
              #     on top of an interpolated node). LoRA is applied by get_model() on the
              #     rollout model from rollout.model.lora_path.
              #   env.eval.rollout_epoch=1  → replaces deprecated algorithm.eval_rollout_epoch
              python3 evaluations/eval_embodied_agent.py \
                --config-path /workspace/RLinf/examples/embodiment/config \
                --config-name maniskill_ppo_openvlaoft \
                runner.logger.log_path=/fsx/checkpoints/openvlaoft-eval-video \
                runner.ckpt_path=${CKPT_PATH} \
                'rollout.model=${actor.model}' \
                actor.model.model_path=/fsx/models/openvla-oft-sft-libero10 \
                actor.model.lora_path=${LORA_PATH} \
                rollout.pipeline_stage_num=2 \
                rollout.enable_offload=True \
                env.eval.enable_offload=True \
                env.eval.total_num_envs=16 \
                env.eval.max_steps_per_rollout_epoch=1360 \
                env.eval.video_cfg.save_video=True \
                env.eval.rollout_epoch=1 \
                cluster.num_nodes=1

              echo "=== Eval complete. Videos at /fsx/checkpoints/openvlaoft-eval-video/video/ ==="
              ls -la /fsx/checkpoints/openvlaoft-eval-video/video/eval/seed_*/0.mp4 2>/dev/null || \
                find /fsx/checkpoints/openvlaoft-eval-video -name "*.mp4" -ls
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: MANISKILL_ASSET_DIR
              value: "/fsx/assets/maniskill"
          resources:
            requests:
              nvidia.com/gpu: 8
              cpu: "90"
              memory: "1000Gi"
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
