# Eval-only job to regenerate OpenVLA showcase video.
#
# Produces a 7-tile (single row) video at ~170 frames / 5fps with smooth motion.
# OpenVLA uses num_action_chunks=1, so every frame has real motion — no
# post-processing frame stripping is needed.
#
# Uses eval_embodied_agent.py (only_eval=True) with pipeline_stage_num=2 to produce
# the 7-tile layout (16 envs ÷ 4 GPUs ÷ 2 stages = 2 envs/stage → 7 tiles
# via ManiSkill RecordVideo tiling after stage merge).
#
# Prerequisites:
#   - Checkpoint on FSx (from training run)
#   - Model weights at /fsx/models/openvla-7b-rlvla-warmup (from model-download.yaml)
#   - ManiSkill assets at /fsx/assets/maniskill
#
# Usage:
#   export ECR_URI=<account>.dkr.ecr.<region>.amazonaws.com/rlinf-on-eks/rlinf
#   export NAMESPACE=rlinf
#   export CKPT_PATH=/fsx/checkpoints/<run>/.../full_weights.pt
#   ./examples/scripts/generate-showcase-video.sh maniskill-openvla-ppo
#
# Output:
#   Video at /fsx/checkpoints/openvla-eval-video/video/eval/seed_*/0.mp4
#   Result: ~171 frames, 5fps, 34.2s, 3584x512
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-openvla-eval-video
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    example: maniskill-openvla-ppo
    purpose: eval-video
  annotations:
    rlinf.io/num-action-chunks: "1"
    rlinf.io/video-output-path: "openvla-eval-video"
    rlinf.io/asset-filename: "maniskill_openvla_success.mp4"
    rlinf.io/s3-bucket: "${S3_BUCKET}"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rlinf
        example: maniskill-openvla-ppo
        purpose: eval-video
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        node.kubernetes.io/instance-type: p5en.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: eval
          image: ${ECR_URI}:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              set -x

              # Activate venv
              export PYTHONPATH="${PYTHONPATH:-}"
              source /opt/venv/openvla/bin/activate

              # Environment
              export MUJOCO_GL=osmesa
              export PYOPENGL_PLATFORM=osmesa
              export NVIDIA_DRIVER_CAPABILITIES=all
              export LD_LIBRARY_PATH="/usr/lib64:${LD_LIBRARY_PATH:-}"
              export NCCL_DEBUG=WARN
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              export EMBODIED_PATH=/workspace/RLinf/examples/embodiment

              # Link simulator assets
              if [ -x "/usr/local/bin/link_assets" ]; then link_assets; fi

              cd /workspace/RLinf

              # Run eval with video recording.
              # OpenVLA uses num_action_chunks=1 so every step produces a unique frame.
              # max_steps_per_rollout_epoch=160 gives ~2 full episodes (80 steps each).
              python3 examples/embodiment/eval_embodied_agent.py \
                --config-path config \
                --config-name maniskill_ppo_openvla \
                runner.logger.log_path=/fsx/checkpoints/openvla-eval-video \
                runner.ckpt_path=${CKPT_PATH} \
                actor.model.model_path=/fsx/models/openvla-7b-rlvla-warmup \
                rollout.model.model_path=/fsx/models/openvla-7b-rlvla-warmup \
                rollout.pipeline_stage_num=2 \
                rollout.enable_offload=True \
                env.eval.enable_offload=True \
                env.eval.total_num_envs=16 \
                env.eval.max_steps_per_rollout_epoch=160 \
                env.eval.video_cfg.save_video=True \
                algorithm.eval_rollout_epoch=1 \
                cluster.num_nodes=1

              echo "=== Eval complete. Videos at /fsx/checkpoints/openvla-eval-video/video/ ==="
              ls -la /fsx/checkpoints/openvla-eval-video/video/eval/seed_*/0.mp4 2>/dev/null || \
                find /fsx/checkpoints/openvla-eval-video -name "*.mp4" -ls
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: MANISKILL_ASSET_DIR
              value: "/fsx/assets/maniskill"
          resources:
            requests:
              nvidia.com/gpu: 8
              cpu: "90"
              memory: "1000Gi"
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
