# LIBERO Spatial + pi0 PPO
#
# Same container image as the ManiSkill examples, different venv, simulator, and config.
# Trains pi0 (flow-matching policy) on LIBERO spatial tasks using PPO.
#
# Image: embodied-maniskill_libero (same image -- includes LIBERO)
# Venv:  openpi
# Config: libero_spatial_ppo_openpi_quickstart (32 envs, actor/env/rollout on all GPUs)
#
# Runs on ONE g7e.12xlarge (2x RTX PRO 6000 96 GB, gpu-sim pool) at micro batch 32.
# EKS 1.37 (2026-11): ~430 s/step, ~$1.0/step on-demand.
# Large-GPU alternative (8x H200, ~192-224 s/step): set the nodeSelector to
# `node.kubernetes.io/instance-type: p5en.48xlarge` (gpu-training pool), NUM_GPUS=8,
# nvidia.com/gpu: 8 (cpu 90, memory 1000Gi).
#
# Prerequisites:
#   - gpu-sim pool enabled (workloads: enable_sim_pool=true; sim_instance_types includes g7e.12xlarge)
#   - model-download.yaml completed (downloads rlinf-pi0-sft-spatial)
#   - LIBERO dataset at /fsx/datasets/libero (auto-downloads on first run;
#     optionally pre-stage via the dataset-preparation skill)
#
# Usage:
#   export IMAGE=$(terraform -chdir=infrastructure/build output -raw ecr_repository_url):latest   # or :<profile>-latest
#   envsubst '${IMAGE} ${NAMESPACE}' < examples/libero-pi0-ppo/manifests/libero-pi0-ppo.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-libero-pi0
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    reference: rlinf
    example: libero-pi0-ppo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rlinf
        example: libero-pi0-ppo
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        role: gpu-sim
        node.kubernetes.io/instance-type: g7e.12xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: training
          image: ${IMAGE}
          command: ["bash", "/workspace/eks/scripts/run_training_eks.sh"]
          env:
            - name: CONFIG_NAME
              value: "libero_spatial_ppo_openpi_quickstart"
            - name: VENV_NAME
              value: "openpi"
            - name: MODEL_PATH
              value: "/fsx/models/rlinf-pi0-sft-spatial"
            - name: HYDRA_OVERRIDES
              value: "actor.micro_batch_size=32 runner.max_epochs=300"
            - name: NUM_GPUS
              value: "2"
            - name: NUM_NODES
              value: "1"
            - name: CKPT_PATH
              value: "/fsx/checkpoints"
            # LIBERO-specific
            - name: LIBERO_DATASET_DIR
              value: "/fsx/datasets/libero"
            - name: ROBOT_PLATFORM
              value: "LIBERO"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          resources:
            requests:
              nvidia.com/gpu: 2
              cpu: "40"
              memory: "400Gi"
            limits:
              nvidia.com/gpu: 2
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
