# LIBERO Spatial + pi0 PPO
#
# Same container image as the ManiSkill examples, different venv, simulator, and config.
# Trains pi0 (flow-matching policy) on LIBERO spatial tasks using PPO.
#
# Image: embodied-maniskill_libero (same image -- includes LIBERO)
# Venv:  openpi
# Config: libero_spatial_ppo_openpi_quickstart
#
# Prerequisites:
#   - model-download.yaml completed (downloads rlinf-pi0-sft-spatial)
#   - LIBERO dataset staged on FSx (see dataset-preparation skill)
#
# Usage:
#   export ECR_URI=<account>.dkr.ecr.<region>.amazonaws.com/rlinf-on-eks/rlinf
#   envsubst < examples/libero-pi0-ppo.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-libero-pi0
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    reference: rlinf
    example: libero-pi0-ppo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rlinf
        example: libero-pi0-ppo
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        node.kubernetes.io/instance-type: p5en.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: training
          image: ${ECR_URI}:latest
          command: ["bash", "/workspace/eks/scripts/run_training_eks.sh"]
          env:
            - name: CONFIG_NAME
              value: "libero_spatial_ppo_openpi_quickstart"
            - name: VENV_NAME
              value: "openpi"
            - name: MODEL_PATH
              value: "/fsx/models/rlinf-pi0-sft-spatial"
            - name: HYDRA_OVERRIDES
              value: "actor.micro_batch_size=32 runner.max_epochs=300"
            - name: NUM_GPUS
              value: "8"
            - name: NUM_NODES
              value: "1"
            - name: CKPT_PATH
              value: "/fsx/checkpoints"
            # LIBERO-specific
            - name: LIBERO_DATASET_DIR
              value: "/fsx/datasets/libero"
            - name: ROBOT_PLATFORM
              value: "LIBERO"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          resources:
            requests:
              nvidia.com/gpu: 8
              cpu: "90"
              memory: "1000Gi"
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
