# Eval-only job to regenerate LIBERO/Pi0 showcase video.
#
# Produces a single-tile (512x512) video at 30fps with smooth motion.
# Pi0 uses num_action_chunks=5 in the policy but LIBERO's env-level recording
# captures every simulator step, so no frame stripping is needed.
#
# LIBERO uses headless MuJoCo (robosuite) which runs lightweight CPU-side envs,
# enabling massively parallel eval (500 envs). The video records a single env.
#
# Prerequisites:
#   - Checkpoint on FSx (from training run)
#   - Model weights at /fsx/models/rlinf-pi0-sft-spatial (from model-download.yaml)
#   - LIBERO dataset at /fsx/datasets/libero
#
# Usage:
#   export ECR_URI=<account>.dkr.ecr.<region>.amazonaws.com/rlinf-on-eks/rlinf
#   export NAMESPACE=rlinf
#   export CKPT_PATH=/fsx/checkpoints/<run>/.../full_weights.pt
#   ./examples/scripts/generate-showcase-video.sh libero-pi0-ppo
#
# Output:
#   Video at /fsx/checkpoints/libero-pi0-eval-video/video/eval/seed_*/0.mp4
#   Result: ~241 frames, 30fps, 8.0s, 512x512
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-libero-pi0-eval-video
  namespace: ${NAMESPACE}
  labels:
    app: rlinf
    example: libero-pi0-ppo
    purpose: eval-video
  annotations:
    rlinf.io/num-action-chunks: "1"
    rlinf.io/video-output-path: "libero-pi0-eval-video"
    rlinf.io/asset-filename: "libero_pi0_success.mp4"
    rlinf.io/s3-bucket: "${S3_BUCKET}"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rlinf
        example: libero-pi0-ppo
        purpose: eval-video
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        node.kubernetes.io/instance-type: p5en.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: eval
          image: ${ECR_URI}:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              set -x

              # Activate venv
              export PYTHONPATH="${PYTHONPATH:-}"
              source /opt/venv/openpi/bin/activate

              # Environment
              export MUJOCO_GL=osmesa
              export PYOPENGL_PLATFORM=osmesa
              export NVIDIA_DRIVER_CAPABILITIES=all
              export LD_LIBRARY_PATH="/usr/lib64:${LD_LIBRARY_PATH:-}"
              export NCCL_DEBUG=WARN
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              export EMBODIED_PATH=/workspace/RLinf/examples/embodiment
              export LIBERO_DATASET_DIR=/fsx/datasets/libero
              export ROBOT_PLATFORM=LIBERO

              # Link simulator assets
              if [ -x "/usr/local/bin/link_assets" ]; then link_assets; fi

              cd /workspace/RLinf

              # Run eval with video recording.
              # LIBERO records every simulator step (regardless of action chunking),
              # so max_steps_per_rollout_epoch=240 gives one full episode per env.
              # Note: LIBERO config doesn't support env.eval.enable_offload (not in struct).
              # actor.micro_batch_size=32 needed to satisfy batch size assertion on 8 GPUs.
              python3 examples/embodiment/eval_embodied_agent.py \
                --config-path config \
                --config-name libero_spatial_ppo_openpi_quickstart \
                runner.logger.log_path=/fsx/checkpoints/libero-pi0-eval-video \
                runner.ckpt_path=${CKPT_PATH} \
                actor.model.model_path=/fsx/models/rlinf-pi0-sft-spatial \
                actor.micro_batch_size=32 \
                rollout.model.model_path=/fsx/models/rlinf-pi0-sft-spatial \
                rollout.pipeline_stage_num=1 \
                rollout.enable_offload=True \
                env.eval.total_num_envs=8 \
                env.eval.max_steps_per_rollout_epoch=240 \
                env.eval.video_cfg.save_video=True \
                algorithm.eval_rollout_epoch=1 \
                cluster.num_nodes=1

              echo "=== Eval complete. Videos at /fsx/checkpoints/libero-pi0-eval-video/video/ ==="
              ls -la /fsx/checkpoints/libero-pi0-eval-video/video/eval/seed_*/0.mp4 2>/dev/null || \
                find /fsx/checkpoints/libero-pi0-eval-video -name "*.mp4" -ls
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: LIBERO_DATASET_DIR
              value: "/fsx/datasets/libero"
            - name: ROBOT_PLATFORM
              value: "LIBERO"
          resources:
            requests:
              nvidia.com/gpu: 8
              cpu: "90"
              memory: "1000Gi"
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
