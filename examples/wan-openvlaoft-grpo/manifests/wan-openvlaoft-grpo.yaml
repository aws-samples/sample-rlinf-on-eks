# Wan World Model GRPO: RL fine-tune OpenVLA-OFT on LIBERO-Spatial where the
# environment is the Wan action-conditioned video world model (no physics sim).
# Render with: envsubst '${ECR_URI} ${NAMESPACE}' | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: rlinf-wan-openvlaoft-grpo
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: training-sa
      nodeSelector:
        node.kubernetes.io/instance-type: p5en.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: training
          image: ${ECR_URI}:latest
          imagePullPolicy: Always
          command: ["bash", "/workspace/eks/scripts/run_training_eks.sh"]
          env:
            - name: CONFIG_NAME
              value: "wan_libero_spatial_grpo_openvlaoft"
            - name: VENV_NAME
              value: "openvla-oft"
            - name: MODEL_PATH
              value: "/fsx/models/Openvla-oft-SFT-libero-spatial-traj1"
            # env.train.enable_offload=False: the Wan world-model env's offload
            # method isn't detected through the env-wrapper stack, so the upstream
            # default (enable_offload=True) trips an assertion at env init. Disabling
            # env offload runs fine on p5en H200 (141GB); revisit for smaller GPUs.
            - name: HYDRA_OVERRIDES
              value: "env.train.wan_wm_hf_ckpt_path=/fsx/models/RLinf-Wan-LIBERO-Spatial env.train.enable_offload=False"
            # Evaluation runs in the REAL LIBERO simulator (env/eval: libero_spatial),
            # a different backend than the Wan training env. It needs the LIBERO
            # dataset + platform vars below. Eval is OFF by default in the shipped
            # config (runner.val_check_interval=-1); enable it by appending e.g.
            # runner.val_check_interval=<N> to HYDRA_OVERRIDES. These vars are inert
            # when eval is disabled, so they are safe to keep set.
            - name: LIBERO_DATASET_DIR
              value: "/fsx/datasets/libero"
            - name: ROBOT_PLATFORM
              value: "LIBERO"
            - name: NUM_GPUS
              value: "8"
            - name: NUM_NODES
              value: "1"
            - name: CKPT_PATH
              value: "/fsx/checkpoints"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          resources:
            requests:
              nvidia.com/gpu: 8
              cpu: "90"
              memory: "1000Gi"
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-claim
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
