# libero_spatial_eval_dreamzero_14b.yaml
# =============================================================================
# DreamZero 14B LIBERO-Spatial simulator eval config (RLinf-on-EKS variant).
#
# WHY THIS FILE EXISTS:
#   Upstream RLinf ships only a *5B* DreamZero eval config
#   (evaluations/libero/libero_spatial_dreamzero_eval.yaml). It pins the 5B WAM
#   architecture (`model/dreamzero_5b@rollout.model`: dim 3072, 30 layers) and
#   Wan2.2-TI2V-5B component paths. OUR trained checkpoint is the 14B WAM
#   (dim 5120, 40 layers), warm-started from DreamZero-DROID and SFT'd on LIBERO
#   (examples/sft/config/libero_sft_dreamzero_14b.yaml). A 14B full_weights.pt
#   cannot strict-load into a 5B architecture, so this file is a 14B variant of
#   the upstream 5B eval config: same structure, 14B model group.
#
# HOW IT RUNS (upstream entrypoint):
#   evaluations/eval_embodied_agent.py. It forces runner.task_type=embodied_eval
#   (=> runner.only_eval=True) and creates ONLY the rollout + env worker groups.
#   The policy is read from `rollout.model` (there is no actor / FSDP / weight
#   syncer in eval), so this config has no actor, fsdp_config, weight_syncer, or
#   train-env sections.
#
# HOW THE 14B ARCHITECTURE RESOLVES:
#   The 14B arch file (model/dreamzero_14b.yaml) exists only in the SFT config
#   tree (examples/sft/config/), so that directory is added to hydra.searchpath
#   next to upstream's EMBODIED_PATH/config (env/ groups). The SFT model file
#   interpolates `${actor.model.*}` because it is written for the SFT actor.
#   Eval has no actor, so the interpolated keys are re-bound under
#   rollout.model.action_head_cfg below, using relative interpolations (the same
#   form as upstream's model/dreamzero_5b.yaml).
#
#   The embodied eval path does NOT merge the checkpoint's config.json. The
#   architecture comes entirely from this YAML.
#
# HOW THIS FILE IS DELIVERED TO THE CONTAINER:
#   It lives in OUR repo (examples/dreamzero/configs/), not upstream. It is
#   mounted via the `dreamzero-eval-config` ConfigMap at /opt/eval-config/.
#   run_dreamzero_eval_eks.sh copies it into /workspace/RLinf/evaluations/libero/
#   (the entrypoint's config dir) before invoking the eval.
#   See examples/dreamzero/manifests/dreamzero-eval.yaml.
# =============================================================================

defaults:
  - env/libero_spatial@env.eval
  # 14B WAM architecture (NOT the 5B model/dreamzero_5b). Resolved from the SFT
  # config tree via the hydra.searchpath entry below.
  - model/dreamzero_14b@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    # model/dreamzero_14b.yaml ships only under the SFT config tree. This is the
    # deterministic in-container path (examples/Dockerfile COPYs RLinf/ here).
    - file:///workspace/RLinf/examples/sft/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_eval_dreamzero_14b"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  # Launcher sets runner.ckpt_path to the converted full_weights.pt.
  ckpt_path: /path/to/model.pt

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    # LIBERO-Spatial: 10 tasks x 50 trials = 500 init states. With total_num_envs parallel envs,
    # set max_steps_per_rollout_epoch to ceil(500/total_num_envs) * max_episode_steps so auto_reset
    # cycles through the full suite within one env.eval.rollout_epoch (see vla-eval.rst).
    #
    # GPU-MEMORY NOTE (14B): the upstream 5B eval uses total_num_envs=128. The
    # 16.48B DreamZero model plus the LIBERO sim on one node's 8x H200 OOMs at
    # 128 envs (only ~280MB free on GPU 0). 16 envs fits.
    # ceil(500/16) * 480 = 32 * 480 = 15360 -> full-suite coverage.
    # For a quick smoke eval, lower max_steps_per_rollout_epoch (e.g. 960) via
    # the launcher's HYDRA_OVERRIDES.
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 15360
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: "dreamzero"
    precision: bf16
    # Launcher sets model_path=/fsx/models/DreamZero-DROID. The DreamZero-DROID
    # safetensors provide the 14B backbone init; our trained full_weights.pt
    # (runner.ckpt_path) is then strict-loaded over it.
    model_path: null
    # umt5-xxl tokenizer. Launcher overrides to /fsx/models/umt5-xxl.
    tokenizer_path: google/umt5-xxl  # https://huggingface.co/google/umt5-xxl

    # 5B vs 14B: the upstream 5B eval sets these to Wan2.2-TI2V-5B paths. For 14B
    # they stay null (same as model/dreamzero_14b.yaml and the 14B SFT config).
    # skip_component_loading is enabled at build time when the full DreamZero
    # safetensors are present under model_path
    # (rlinf/models/embodiment/dreamzero/__init__.py). Setting 5B paths here would
    # force a wrong (5B) backbone build.
    diffusion_model_pretrained_path: null
    image_encoder_pretrained_path: null
    text_encoder_pretrained_path: null
    vae_pretrained_path: null

    # Dataset-generated metadata.json for normalisation statistics (libero_sim).
    # Generate with: python toolkits/lerobot/generate_dreamzero_metadata.py \
    #   --preset libero_sim --dataset-root /path/to/libero --output-metadata /path/to/metadata.json
    # Defined in the struct (as upstream's eval config does), so the launcher
    # overrides it WITHOUT a '+' prefix.
    metadata_json_path: /path/to/metadata.json

    embodiment_tag: "libero_sim"

    is_lora: False
    # LIBERO temporal alignment: action_horizon, num_action_chunks and
    # num_action_per_block must all be 16. model/dreamzero_14b.yaml defaults
    # num_action_per_block to 24 (a DROID value); 16 keeps
    # num_action_per_block // num_frame_per_block consistent with LIBERO.
    action_horizon: 16
    num_action_chunks: 16
    num_action_per_block: 16
    # 14B render size (model/dreamzero_14b.yaml: 352x640). This differs from the
    # 5B eval config's 160x320.
    target_video_height: 352
    target_video_width: 640

    # Re-bind the SFT model file's `${actor.model.*}` interpolations to this
    # rollout.model node (eval has no actor). Relative form as in dreamzero_5b.yaml.
    action_head_cfg:
      config:
        action_dim: ${...action_dim}
        action_horizon: ${...action_horizon}
        max_action_dim: ${...max_action_dim}
        max_state_dim: ${...max_state_dim}
        target_video_height: ${...target_video_height}
        target_video_width: ${...target_video_width}
        diffusion_model_cfg:
          diffusion_model_pretrained_path: ${....diffusion_model_pretrained_path}
          num_action_per_block: ${....num_action_per_block}
        image_encoder_cfg:
          image_encoder_pretrained_path: ${....image_encoder_pretrained_path}
        text_encoder_cfg:
          text_encoder_pretrained_path: ${....text_encoder_pretrained_path}
        vae_cfg:
          vae_pretrained_path: ${....vae_pretrained_path}
